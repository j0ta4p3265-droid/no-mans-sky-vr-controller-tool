name: Import full source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import source archive
        shell: bash
        run: |
          if [ ! -f source-import.zip ]; then
            echo "No source-import.zip present; nothing to import."
            exit 0
          fi

          mkdir imported-source
          unzip -q source-import.zip -d imported-source
          rsync -a --exclude='.git' imported-source/ ./
          rm -rf imported-source source-import.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Import complete project source"
          git push
